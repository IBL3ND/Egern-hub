<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://iili.io/KBtLXCx.png">
    <link rel="icon" type="image/png" href="https://iili.io/KBtLXCx.png">
    <meta name="apple-mobile-web-app-title" content="Egern 模块转换器">
    <title>Egern 模块转换器</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101613;
        --surface: #1a211e;
        --surface-2: #232b27;
        --ink: #e8efec;
        --ink-2: #a7b5af;
        --line: #333e39;
        --accent: #2fae8a;
        --accent-ink: #08130f;
        --accent-soft: #173b31;
        --warn-bg: #38300f;
        --warn-line: #5c4f1e;
        --warn-ink: #ecd28a;
        --err-bg: #3d1a16;
        --err-ink: #f0a49c;
        --code-bg: #141a17;
        --radius: 10px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
        font-size: 15px;
        line-height: 1.55;
      }
      button, input, select, summary { min-height: 2.25rem; }
      .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 40px; }
      .intro {
        margin: 4px 0 16px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 14px 16px;
      }
      .intro h1 { font-size: 21px; margin: 0 0 4px; font-weight: 700; letter-spacing: .01em; }
      .intro p { margin: 0; color: var(--ink-2); font-size: 13.5px; max-width: 72ch; }
      .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
      @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 14px;
      }
      .panel h2 { font-size: 14px; margin: 0 0 10px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
      .panel h2 .tag {
        font-size: 11px; font-weight: 600; color: var(--accent);
        background: var(--accent-soft); border-radius: 999px; padding: 2px 8px;
      }
      textarea {
        width: 100%;
        min-height: 380px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--code-bg);
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 12.5px;
        line-height: 1.6;
        padding: 10px 12px;
        outline: none;
      }
      textarea:focus { border-color: var(--accent); }
      textarea[readonly] { cursor: text; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .row + .row { margin-top: 10px; }
      .row label { font-size: 13px; color: var(--ink-2); }
      button {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--ink);
        border-radius: 8px;
        padding: 6px 14px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      button.primary:hover { filter: brightness(1.07); }
      button:disabled { opacity: .5; cursor: default; }
      input[type="text"], input[type="url"] {
        flex: 1 1 180px;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--code-bg);
        color: var(--ink);
        padding: 6px 10px;
        font-size: 13px;
        font-family: inherit;
        outline: none;
      }
      input[type="text"]:focus, input[type="url"]:focus { border-color: var(--accent); }
      input[type="file"] { display: none; }
      .msg { font-size: 13px; margin-top: 10px; display: none; border-radius: 8px; padding: 8px 12px; }
      .msg.err { display: block; background: var(--err-bg); color: var(--err-ink); }
      .msg.ok { display: block; background: var(--accent-soft); color: var(--ink); }
      .stats { font-size: 12.5px; color: var(--ink-2); margin-top: 10px; min-height: 1.2em; }
      .warnings { margin-top: 16px; }
      .warnings:empty { display: none; }
      .warnings .box {
        background: var(--warn-bg);
        border: 1px solid var(--warn-line);
        border-radius: var(--radius);
        padding: 12px 14px;
      }
      .warnings h2 { font-size: 14px; margin: 0 0 8px; color: var(--warn-ink); }
      .warnings ul { margin: 0; padding-left: 20px; color: var(--warn-ink); font-size: 13px; }
      .warnings li { margin: 3px 0; overflow-wrap: anywhere; }
      .warnings code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
      }
      .notes { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
      .notes .chip {
        font-size: 12.5px;
        color: var(--ink);
        background: var(--surface-2);
        border-radius: 999px;
        padding: 6px 14px;
        line-height: 1.5;
      }
      .notes .chip.warn { color: var(--warn-ink); }

      /* ---------- Border Beam 流光边框（全页） ---------- */
      @property --beam-angle {
        syntax: '<angle>';
        initial-value: 0deg;
        inherits: false;
      }
      @keyframes beam-spin {
        to { --beam-angle: 360deg; }
      }
      /* 面板级：最早在输入面板上验证过的实现——旋转 conic-gradient，
         ::after 用 mask 只露出 2px 边框环，::before 同渐变模糊作辉光。
         面板加 isolation 自成层叠上下文，辉光层才不会被面板自身底色盖住。 */
      .beam-panel, .warnings .box {
        position: relative;
        isolation: isolate;
      }
      .beam-panel::before, .warnings .box::before {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: inherit;
        background: conic-gradient(from var(--beam-angle, 0deg),
          transparent 0deg,
          #3B82F6 12deg, #14B8A6 32deg, #22D3EE 50deg, #22C55E 66deg,
          #EAB308 82deg, #F97316 97deg, #EF4444 109deg, #ffffff 115deg,
          transparent 116deg, transparent 360deg);
        filter: blur(16px);
        opacity: .5;
        z-index: -1;
        animation: beam-spin var(--beam-dur, 3.2s) linear infinite;
        animation-delay: var(--beam-delay, 0s);
        pointer-events: none;
      }
      .beam-panel::after, .warnings .box::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: conic-gradient(from var(--beam-angle, 0deg),
          transparent 0deg,
          #3B82F6 12deg, #14B8A6 32deg, #22D3EE 50deg, #22C55E 66deg,
          #EAB308 82deg, #F97316 97deg, #EF4444 109deg, #ffffff 115deg,
          transparent 116deg, transparent 360deg);
        padding: 2px;
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask-composite: exclude;
        z-index: 2;
        animation: beam-spin var(--beam-dur, 3.2s) linear infinite;
        animation-delay: var(--beam-delay, 0s);
        pointer-events: none;
      }
      .warnings .box { --beam-delay: -2.2s; --beam-dur: 4s; }
      /* 控件级：约 1.5px 光束环、不带辉光；内层保持元素原底色，最底层垫一圈原边框色作轨道 */
      .beam-ctl, textarea.beam-ctl, input.beam-ctl, button.beam-ctl {
        --ctl-bg: var(--code-bg);
        border: 1.5px solid transparent;
        background:
          linear-gradient(var(--ctl-bg), var(--ctl-bg)) padding-box,
          conic-gradient(from var(--beam-angle, 0deg),
            transparent 0deg,
            #3B82F6 12deg, #14B8A6 32deg, #22D3EE 50deg, #22C55E 66deg,
            #EAB308 82deg, #F97316 97deg, #EF4444 109deg, #ffffff 115deg,
            transparent 116deg, transparent 360deg) border-box,
          linear-gradient(var(--line), var(--line)) border-box;
        animation: beam-spin var(--beam-dur, 3.2s) linear infinite;
        animation-delay: var(--beam-delay, 0s);
      }
      button.beam-ctl { --ctl-bg: var(--surface-2); }
      button.primary.beam-ctl { --ctl-bg: var(--accent); }
      .beam-ctl:hover, .beam-ctl:focus { border-color: transparent; }
      textarea.beam-ctl:focus, input.beam-ctl:focus {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      /* 标题旁的小胶囊标签、底部说明胶囊同样套小光束环 */
      .notes .chip {
        --beam-delay: -1.9s;
        --beam-dur: 3.5s;
        border: 1.5px solid transparent;
        background:
          linear-gradient(var(--surface-2), var(--surface-2)) padding-box,
          conic-gradient(from var(--beam-angle, 0deg),
            transparent 0deg,
            #3B82F6 12deg, #14B8A6 32deg, #22D3EE 50deg, #22C55E 66deg,
            #EAB308 82deg, #F97316 97deg, #EF4444 109deg, #ffffff 115deg,
            transparent 116deg, transparent 360deg) border-box,
          linear-gradient(var(--line), var(--line)) border-box;
        animation: beam-spin var(--beam-dur) linear infinite;
        animation-delay: var(--beam-delay);
      }
      .notes .chip.warn {
        background:
          linear-gradient(var(--warn-bg), var(--warn-bg)) padding-box,
          conic-gradient(from var(--beam-angle, 0deg),
            transparent 0deg,
            #3B82F6 12deg, #14B8A6 32deg, #22D3EE 50deg, #22C55E 66deg,
            #EAB308 82deg, #F97316 97deg, #EF4444 109deg, #ffffff 115deg,
            transparent 116deg, transparent 360deg) border-box,
          linear-gradient(var(--warn-line), var(--warn-line)) border-box;
      }
      .panel h2 .tag {
        --beam-delay: -2.6s;
        --beam-dur: 3.4s;
        border: 1.5px solid transparent;
        background:
          linear-gradient(var(--accent-soft), var(--accent-soft)) padding-box,
          conic-gradient(from var(--beam-angle, 0deg),
            transparent 0deg,
            #3B82F6 12deg, #14B8A6 32deg, #22D3EE 50deg, #22C55E 66deg,
            #EAB308 82deg, #F97316 97deg, #EF4444 109deg, #ffffff 115deg,
            transparent 116deg, transparent 360deg) border-box,
          linear-gradient(var(--line), var(--line)) border-box;
        animation: beam-spin var(--beam-dur) linear infinite;
        animation-delay: var(--beam-delay);
      }
      /* ---------- 背景音乐按钮 ---------- */
      .music-btn {
        position: fixed;
        right: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom));
        z-index: 50;
        width: 44px;
        height: 44px;
        min-height: 44px;
        padding: 0;
        border-radius: 50%;
        background: var(--surface-2);
        border: 1px solid var(--line);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .music-btn svg { display: block; }
      .music-btn .icon-pause { display: none; }
      .music-btn.playing { border-color: var(--accent); color: var(--accent); }
      .music-btn.playing .icon-note { display: none; }
      .music-btn.playing .icon-pause { display: block; }
      .music-btn.playing::after {
        content: '';
        position: absolute;
        inset: -1.5px;
        border-radius: 50%;
        background: conic-gradient(from var(--beam-angle, 0deg),
          transparent 0deg,
          #3B82F6 12deg, #14B8A6 32deg, #22D3EE 50deg, #22C55E 66deg,
          #EAB308 82deg, #F97316 97deg, #EF4444 109deg, #ffffff 115deg,
          transparent 116deg, transparent 360deg);
        padding: 1.5px;
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask-composite: exclude;
        animation: beam-spin 2.6s linear infinite;
        pointer-events: none;
      }
      .music-tip {
        position: fixed;
        right: 16px;
        bottom: calc(72px + env(safe-area-inset-bottom));
        z-index: 50;
        background: var(--surface-2);
        border: 1px solid var(--line);
        color: var(--ink-2);
        font-size: 12.5px;
        line-height: 1.4;
        padding: 6px 12px;
        border-radius: 999px;
        opacity: 0;
        pointer-events: none;
        transition: opacity .25s ease;
      }
      .music-tip.show { opacity: 1; }

      @media (prefers-reduced-motion: reduce) {
        .beam-panel::before, .beam-panel::after,
        .warnings .box::before, .warnings .box::after,
        .beam-ctl, .panel h2 .tag, .notes .chip,
        .music-btn.playing::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="intro beam-panel" style="--beam-delay:-.8s;--beam-dur:3.8s">
        <h1>Surge / Loon / Quantumult X → Egern YAML</h1>
        <p>把 .sgmodule 或圈X .conf 内容粘贴进来、上传文件或填链接抓取，一键生成 Egern 原生 YAML 模块（圈X 输入会自动识别）。转换全部在本页本地完成，不经过任何服务器；无法自动转换的行会列在下方「需要注意」里。</p>
      </div>

      <div class="layout">
        <section class="panel beam-panel" aria-label="输入">
          <h2>输入 <span class="tag">.sgmodule / .conf</span></h2>
          <textarea id="input" class="beam-ctl" style="--beam-delay:-.5s;--beam-dur:3.4s" placeholder="把 .sgmodule 或圈X .conf 内容粘贴到这里…" spellcheck="false"></textarea>
          <div class="row">
            <button type="button" id="btnUpload" class="beam-ctl" style="--beam-delay:-.9s;--beam-dur:3.5s">上传文件</button>
            <input type="file" id="fileInput" accept=".sgmodule,.module,.txt,.conf,.snippet,text/plain" />
            <button type="button" id="btnSample" class="beam-ctl" style="--beam-delay:-1.7s;--beam-dur:3.1s">载入示例</button>
            <button type="button" id="btnClear" class="beam-ctl" style="--beam-delay:-2.4s;--beam-dur:3.7s">清空</button>
          </div>
          <div class="row">
            <input type="url" id="urlInput" class="beam-ctl" style="--beam-delay:-1.3s;--beam-dur:3s" placeholder="模块链接，如 https://raw.githubusercontent.com/…/xxx.sgmodule" aria-label="模块链接" />
            <button type="button" id="btnFetch" class="beam-ctl" style="--beam-delay:-.2s;--beam-dur:3.3s">抓取</button>
          </div>
          <div class="row">
            <button type="button" class="primary beam-ctl" style="--beam-delay:-1.1s;--beam-dur:2.9s" id="btnConvert">开始转换</button>
          </div>
          <div class="msg" id="inputMsg" role="status"></div>
        </section>

        <section class="panel beam-panel" style="--beam-delay:-1.6s;--beam-dur:3.6s" aria-label="输出">
          <h2>输出 <span class="tag">Egern YAML</span></h2>
          <textarea id="output" class="beam-ctl" style="--beam-delay:-.8s;--beam-dur:3.9s" readonly placeholder="转换结果会显示在这里…" spellcheck="false"></textarea>
          <div class="row">
            <button type="button" id="btnCopy" class="beam-ctl" style="--beam-delay:-2s;--beam-dur:3.6s">复制结果</button>
            <button type="button" id="btnDownload" class="beam-ctl" style="--beam-delay:-.6s;--beam-dur:3.2s">下载为 .yaml</button>
          </div>
          <div class="stats" id="stats"></div>
          <div class="msg" id="outputMsg" role="status"></div>
        </section>
      </div>

      <div class="warnings" id="warnings"></div>

      <div class="notes">
        <span class="chip">转换完成后，你只需复制到 Egern 模块里面，添加为本地模块即可</span>
        <span class="chip warn">⚠️ 注意：需要先填写模块名称和文件名，再复制粘贴进去保存</span>
        <span class="chip">也可以上传到你的 GitHub 里</span>
      </div>
    </div>

    <audio id="bgm" src="https://raw.githubusercontent.com/IBL3ND/js/refs/heads/main/love%20is%20gone.m4a" loop preload="none"></audio>
    <div class="music-tip" id="musicTip" role="status"></div>
    <button type="button" id="btnMusic" class="music-btn" aria-label="播放背景音乐" aria-pressed="false">
      <svg class="icon-note" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>

    <script>
      'use strict';

      var GIF_1X1_BASE64 = 'R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

      /* ---------- YAML 标量输出 ---------- */
      function yamlScalar(value) {
        var s = value === null || value === undefined ? '' : String(value);
        if (s === '') return "''";
        if (s.indexOf('\n') !== -1) {
          // 多行字符串用双引号 + \n 转义，保证单行可读
          return '"' + s.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"';
        }
        var need = false;
        if (/[\\:#]/.test(s)) need = true;
        if (/^\s|\s$/.test(s)) need = true;
        if (/^[!&*?|>%@`"',#\[\]{}-]/.test(s)) need = true;
        if (/^(true|false|null|~|yes|no|on|off)$/i.test(s)) need = true;
        if (/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) need = true;
        if (/[,\[\]{}]/.test(s) && /^[{\[]/.test(s)) need = true;
        if (need) return "'" + s.replace(/'/g, "''") + "'";
        return s;
      }
      function yamlQuoted(value) {
        var s = value === null || value === undefined ? '' : String(value);
        if (s.indexOf('\n') !== -1) return yamlScalar(s);
        return "'" + s.replace(/'/g, "''") + "'";
      }

      /* ---------- 小工具 ---------- */
      function splitTopLevel(str, sep) {
        // 按 sep 切分，但不切引号 / 方括号 / 花括号内部
        var out = [], cur = '', depth = 0, quote = null;
        for (var i = 0; i < str.length; i++) {
          var c = str[i];
          if (quote) {
            cur += c;
            if (c === quote) quote = null;
            continue;
          }
          if (c === '"' || c === "'") { quote = c; cur += c; continue; }
          if (c === '[' || c === '{') depth++;
          if (c === ']' || c === '}') depth--;
          if (c === sep && depth === 0) { out.push(cur); cur = ''; continue; }
          cur += c;
        }
        if (cur !== '') out.push(cur);
        return out;
      }
      function unquote(v) {
        v = v.trim();
        if (v.length >= 2 && v[0] === '"' && v[v.length - 1] === '"') return v.slice(1, -1);
        if (v.length >= 2 && v[0] === "'" && v[v.length - 1] === "'") return v.slice(1, -1).replace(/''/g, "'");
        return v;
      }
      function unquoteArg(v) {
        // argument 原值常带转义引号：先把 \" \\ \/ 等转义还原，再剥外层引号
        var s = String(v).trim().replace(/\\(.)/g, '$1');
        if (s.length >= 2 && s[0] === '"' && s[s.length - 1] === '"') return s.slice(1, -1);
        if (s.length >= 2 && s[0] === "'" && s[s.length - 1] === "'") return s.slice(1, -1).replace(/''/g, "'");
        return s;
      }
      function isTruthyFlag(v) {
        if (v === null || v === undefined) return false;
        var s = String(v).trim().toLowerCase();
        return s === 'true' || s === '1';
      }
      function stripInlineComment(line) {
        // 剥行尾注释：引号外、空白之后的 // 或 # 起的部分（仅用于规则行 / hostname 行，
        // 这类行的值是域名/IP/策略，不含此类序列；重写与脚本行的正则可能含 //，不走这里）
        var quote = null;
        for (var i = 0; i < line.length; i++) {
          var c = line[i];
          if (quote) { if (c === quote) quote = null; continue; }
          if (c === '"' || c === "'") { quote = c; continue; }
          if (i > 0 && /\s/.test(line[i - 1])) {
            if (c === '/' && line[i + 1] === '/') return line.slice(0, i).trimEnd();
            if (c === '#' && (i + 1 >= line.length || /\s/.test(line[i + 1]))) return line.slice(0, i).trimEnd();
          }
        }
        return line;
      }

      /* ---------- 注释 / 禁用行（对齐 Script-Hub 规格 §1.2 / §1.3） ----------
         行首 # / ; / // 统一按注释处理；#! 是元数据、永远不是注释。
         被注释禁用的条目（注释正文仍是条目形状）照常解析、打 disabled 标记，
         输出时在对应段落里以原行注释形式保留；纯说明性注释挂到下一条条目作 mark。 */
      function classifyComment(line) {
        if (line.indexOf('#!') === 0) return { comment: false, body: line };
        if (line[0] === '#') return { comment: true, body: line.slice(1).trim() };
        if (line[0] === ';') return { comment: true, body: line.slice(1).trim() };
        if (line.indexOf('//') === 0) return { comment: true, body: line.slice(2).trim() };
        return { comment: false, body: line };
      }

      /* ---------- 逻辑规则 AND / OR / NOT 解析（对齐 Script-Hub parseRule 的括号解析思路） ----------

          var inner = s.slice(1, -1).trim();
          var lm = inner.match(/^(AND|OR|NOT)\s*,\s*/i);
          if (lm) {
            var lop = lm[1].toLowerCase();

            if (!subs) return null;
            if (lop === 'not') {
              if (subs.length !== 1) return null;

            if (!subs.length) return null;
            return { kind: lop, subs: subs };
          }
          var ci = inner.indexOf(',');

          var t = inner.slice(0, ci).trim().toUpperCase();

      /* ---------- YAML 拼装（Surge / Loon 与圈X 共用，保证产出结构一致） ----------

        if (meta.description) out.push('description: ' + yamlScalar(meta.description));
        if (meta.author) out.push('author: ' + yamlScalar(meta.author));

            if ((lv === '0' || lv === '1' || lv === 'true' || lv === 'false') && !isTextArg(a.key)) {

            out.push('      match: ' + yamlScalar(bw.match));

            if (sc.argument !== null && sc.argument !== undefined && sc.argument !== '') {

          out.push('  hostnames:');
          if (mitmHosts.length) {

            mitmHosts.forEach(function (h) {
              if (h.disabled) { disabledLine('      ', h); return; }
              markLine('      ', h);
              out.push('      - ' + yamlScalar(h.h));
            });
          }
          if (mitmExcludes && mitmExcludes.length) {
            out.push('    excludes:');
            mitmExcludes.forEach(function (h) {

              markLine('      ', h);
              out.push('      - ' + yamlScalar(h.h));

          realIpDomains.forEach(function (h) {

      /* ---------- hostname 类行收集（对齐 Script-Hub §4：与段头无关，任意位置都收） ----------
         %...% 占位符在解析期剥除（U14），绝不写进 includes；

      /* ---------- Quantumult X（圈X）识别 ---------- */

          if (sm) {

            if (QX_SECTIONS[nm.toLowerCase()]) return true;
            if (nm === 'mitm') return true; // 圈X 用小写 [mitm]，Surge / Loon 写 [MITM]
            continue;
          }
          if (/^\S+\s+url\s+(reject|reject-200|reject-dict|reject-array|reject-img|302|307|header|script-[a-z-]+|request-body|response-body|request-header|response-header|jsonjq-[a-z-]+|echo-response)/i.test(line)) return true;
        }

      }

      function convertQX(source, sourceName) {
        var warnings = [];

        var urlRewrites = [], bodyRewrites = [], headerRewrites = [], realIpDomains = [];
        var hostStore = newHostStore();

        var counts = { rules: 0, rewrites: 0, scriptings: 0, mitm: 0 };

        var warnedFhe = false, warnedSkipProxy = false;
        var lines = String(source).replace(/\r\n?/g, '\n').split('\n');

        var QX_SKIP = {
          'server_local': '是节点配置，Egern 模块不包含节点',
          'server_remote': '是远程节点订阅，Egern 模块不包含节点',
          'dns': '是 DNS 设置，属于配置文件范畴、Egern 模块不包含',

                if (hci > 0) {
                  if (!mlHeaders) mlHeaders = {};
                  mlHeaders[hparts[hpi].slice(0, hci).trim()] = hparts[hpi].slice(hci + 1).trim();
                }
              }
            }
            var mlBody = mlData === null ? '' : mlData;
            var mle = { match: mlPattern, action: { status: mlStatus, headers: mlHeaders, body: mlBody, omitBody: mlBody === '' } };
            tag(mle, ctx, takeMark);
            rewrites.push(mle);
            if (!mle.disabled) counts.rewrites++;
          }
          else if (sup === 'MITM') {
            if (line) {
              warnings.push('第 ' + lineNo + ' 行 MITM 内容无法解析，已跳过：' + line);
            }
          }
        }

        counts.mitm = hostStore.count;

        /* ---------- arguments ---------- */
        var argList = argsRaw ? parseArguments(argsRaw) : [];
        var descMap = {};
        if (argList.length) {
          var descRes = parseArgumentsDesc(argsDescRaw || '', argList.map(function (a) { return a.key; }));
          descMap = descRes.map;
          if (descRes.freeText) {
            warnings.push('#!arguments-desc 是整段说明文字、没有按参数名分段，未拆分到各参数的说明里；各参数 description 已回退为参数名本身，整段原文请在原模块里查看。');
          }
        }
        // Loon [Argument] 声明并入参数表（U21）
        for (var lai = 0; lai < loonArgs.length; lai++) {
          var exists = false;
          for (var lej = 0; lej < argList.length; lej++) { if (argList[lej].key === loonArgs[lai].key) { exists = true; break; } }
          if (!exists) argList.push(loonArgs[lai]);
        }
        Object.keys(loonDescMap).forEach(function (k) { if (!descMap[k]) descMap[k] = loonDescMap[k]; });
        // U15：参数型 hostname（默认值恰为 hostname 的参数）——Egern 无此机制，明确提示
        for (var hai = 0; hai < argList.length; hai++) {
          if (String(argList[hai].value).trim() === 'hostname' && !warnedHn2) {
            warnedHn2 = true;
            warnings.push('参数「' + argList[hai].key + '」的默认值是 hostname（参数型 MITM 主机名列表），Egern 没有此机制：请把该参数默认值里的主机名手动填到输出的 mitm.hostnames 里。');
          }
        }
        if (disabledCount) {
          warnings.push('源文件中有 ' + disabledCount + ' 条被注释禁用的条目，已在输出对应段落里以注释行形式保留（删掉行首的 # 即可恢复启用）。');
        }

        /* ---------- 拼 YAML（与圈X 共用 buildYaml） ---------- */
        var extra = { metaComments: metaComments, urlRewrites: urlRewrites, bodyRewrites: bodyRewrites, headerRewrites: headerRewrites, realIpDomains: realIpDomains };
        return { buildArgs: [meta, argList, descMap, rules, rewrites, scriptings, hostStore.includes, hostStore.excludes, extra], scriptings: scriptings, rewrites: rewrites, warnings: warnings, counts: counts, hasMeta: !!meta.name };
      }
      /* ---------- 界面 ---------- */
      var $ = function (id) { return document.getElementById(id); };
      var inputEl = $('input'), outputEl = $('output'), warningsEl = $('warnings'),
          statsEl = $('stats'), inputMsg = $('inputMsg'), outputMsg = $('outputMsg');

      // 最近一次上传/抓取的来源文件名：圈X 输入缺 #!name 时用它补模块头；手动编辑输入即失效
      var sourceFileName = '';
      inputEl.addEventListener('input', function () { sourceFileName = ''; });

      /* ---------- binary_body 判定（对齐 Script-Hub 的 isBinaryMode，规格 §5.3） ---------- */
      function fetchScriptTextOnce(url) {
        if (!/^https?:\/\//i.test(url)) return Promise.reject(new Error('not http'));
        if (typeof AbortController !== 'undefined') {
          var ctrl = new AbortController();
          var timer = setTimeout(function () { ctrl.abort(); }, 6000);
          return fetch(url, { signal: ctrl.signal }).then(function (r) {
            clearTimeout(timer);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text();
          }, function (e) { clearTimeout(timer); throw e; });
        }
        return fetch(url).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        });
      }
      function fetchScriptText(url) {
        // 抓取失败时重试一次：脚本原文判定与 echo 数据内联都只发这一次请求，不值得因瞬时网络抖动整条丢弃
        return fetchScriptTextOnce(url).then(function (t) { return t; }, function () {
          return fetchScriptTextOnce(url);
        });
      }
      function detectBinaryBodies(scriptings) {
        // 对齐 Script-Hub isBinaryMode（规格 §5.3）：仅圈X 脚本条目（binary_check）参与判定；
        // 名字含 proto 直接判真、不抓取；URL 命中关键词名单才抓脚本原文查 '.bodyBytes'；
        // 名单外一律不判、也不发抓取请求。判定结果按 URL 在本次转换内缓存。
        var cache = {};
        var jobs = [];
        scriptings.forEach(function (sc) {
          if (!sc.binary_check || sc.binary_body || sc.disabled) return;
          if (/proto/i.test(sc.name)) { sc.binary_body = true; return; }
          if (!/(tieba|youtube|bili|spotify|wyres|netease|DualSubs\.Subtitles\.Translate\.response)/i.test(sc.script_url)) return;
          var url = sc.script_url;
          if (!cache[url]) {
            cache[url] = fetchScriptText(url).then(function (text) {
              return text.indexOf('.bodyBytes') !== -1;
            }, function () { return false; });
          }
          jobs.push(cache[url].then(function (b) { sc.binary_body = b; }));
        });
        return Promise.all(jobs);
      }

      function resolveEchoRewrites(rewrites, warnings) {
        // U9：echo-response 的数据文件抓取下来内联成 respond；抓取失败/过大则剔除并提示。
        // 同一数据文件只抓一次（按 URL 缓存），结果分发给所有引用它的条目。
        var cache = {};
        var jobs = [];
        rewrites.forEach(function (rw) {
          if (rw.kind !== 'echo' || rw.disabled) return;
          if (!cache[rw.dataUrl]) {
            cache[rw.dataUrl] = fetchScriptText(rw.dataUrl).then(function (text) {
              return { ok: true, text: text };
            }, function () { return { ok: false, text: '' }; });
          }
          jobs.push(cache[rw.dataUrl].then(function (r) {
            if (!r.ok) {
              rw.failed = true;
              warnings.push('echo-response 数据文件抓取失败（' + rw.dataUrl + '），该条已跳过，请手动处理。');
              return;
            }
            if (r.text.length > 262144) {
              rw.failed = true;
              warnings.push('echo-response 数据文件过大（' + rw.dataUrl + '），该条已跳过，请手动处理。');
              return;
            }
            rw.kind = 'respond';
            rw.action = {
              status: 200,
              headers: rw.contentType ? { 'Content-Type': rw.contentType } : null,
              body: r.text,
              omitBody: r.text === ''
            };
          }));
        });
        return Promise.all(jobs);
      }

      function showMsg(el, text, kind) {
        el.textContent = text || '';
        el.className = 'msg' + (text ? ' ' + kind : '');
      }

      function doConvert() {
        showMsg(inputMsg, '', '');
        showMsg(outputMsg, '', '');
        var src = inputEl.value;
        if (!src.trim()) {
          showMsg(inputMsg, '输入是空的：先粘贴 .sgmodule 或圈X .conf 内容、上传文件，或点「载入示例」试试。', 'err');
          return;
        }
        var btn = $('btnConvert');
        btn.disabled = true;
        btn.textContent = '转换中…';
        var res = isQuantumultX(src) ? convertQX(src, sourceFileName) : convert(src);
        function finish() {
          btn.disabled = false;
          btn.textContent = '开始转换';
        }
        // 先做异步判定（圈X 脚本的 binary_body、echo-response 数据文件内联），再拼最终 YAML
        Promise.all([detectBinaryBodies(res.scriptings), resolveEchoRewrites(res.rewrites, res.warnings)]).then(function () {
          outputEl.value = buildYaml.apply(null, res.buildArgs);
          var c = res.counts;
          statsEl.textContent = '已生成：规则 ' + c.rules + ' 条 · 重写 ' + c.rewrites + ' 条 · 脚本 ' + c.scriptings + ' 个 · MITM 主机名 ' + c.mitm + ' 个';
          if (res.warnings.length) {
            var html = '<div class="box"><h2>需要注意（' + res.warnings.length + ' 条）</h2><ul>';
            res.warnings.forEach(function (w) {
              html += '<li>' + w.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</li>';
            });
            html += '</ul></div>';
            warningsEl.innerHTML = html;
          } else {
            warningsEl.innerHTML = '';
          }
          finish();
        }, function () { finish(); });
      }

      $('btnConvert').addEventListener('click', doConvert);

      $('btnClear').addEventListener('click', function () {
        sourceFileName = '';
        inputEl.value = '';
        outputEl.value = '';
        warningsEl.innerHTML = '';
        statsEl.textContent = '';
        showMsg(inputMsg, '', '');
        showMsg(outputMsg, '', '');
      });

      $('btnUpload').addEventListener('click', function () { $('fileInput').click(); });
      $('fileInput').addEventListener('change', function (e) {
        var f = e.target.files && e.target.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () {
          sourceFileName = f.name || '';
          inputEl.value = String(reader.result || '');
          showMsg(inputMsg, '已载入文件「' + f.name + '」，点「开始转换」生成。', 'ok');
        };
        reader.onerror = function () {
          showMsg(inputMsg, '文件读取失败，请换个文件或直接粘贴内容。', 'err');
        };
        reader.readAsText(f);
        e.target.value = '';
      });

      $('btnFetch').addEventListener('click', function () {
        var url = $('urlInput').value.trim();
        if (!url) { showMsg(inputMsg, '先填模块链接再抓取。', 'err'); return; }
        var btn = $('btnFetch');
        btn.disabled = true;
        btn.textContent = '抓取中…';
        fetch(url).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        }).then(function (text) {
          var seg = url.split(/[?#]/)[0].split('/').pop() || '';
          try { seg = decodeURIComponent(seg); } catch (e) { /* 文件名解码失败就用原文 */ }
          sourceFileName = seg;
          inputEl.value = text;
          showMsg(inputMsg, '抓取成功，点「开始转换」生成。', 'ok');
        }).catch(function () {
          showMsg(inputMsg, '抓取失败（多半是对方站点不允许跨域抓取）。请打开链接复制全文，粘贴到输入框里再转换。', 'err');
        }).finally(function () {
          btn.disabled = false;
          btn.textContent = '抓取';
        });
      });

      $('btnCopy').addEventListener('click', function () {
        if (!outputEl.value) { showMsg(outputMsg, '还没有转换结果，先点「开始转换」。', 'err'); return; }
        function done() { showMsg(outputMsg, '已复制到剪贴板。', 'ok'); }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(outputEl.value).then(done).catch(function () {
            outputEl.select();
            document.execCommand('copy');
            done();
          });
        } else {
          outputEl.select();
          document.execCommand('copy');
          done();
        }
      });

      $('btnDownload').addEventListener('click', function () {
        if (!outputEl.value) { showMsg(outputMsg, '还没有转换结果，先点「开始转换」。', 'err'); return; }
        var nameMatch = outputEl.value.match(/^name:\s*(.+)$/m);
        var fname = 'egern-module.yaml';
        if (nameMatch) {
          var nm = nameMatch[1].trim().replace(/^'(.*)'$/, '$1').replace(/[\\/:*?"<>|]/g, '_');
          if (nm) fname = nm + '.yaml';
        }
        var blob = new Blob([outputEl.value], { type: 'text/yaml;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fname;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 300);
      });

      /* ---------- 背景音乐 ---------- */
      var bgm = $('bgm'), musicBtn = $('btnMusic'), musicTip = $('musicTip');
      var musicTipTimer = null;
      var musicUserTouched = false; // 用户手动点过音乐按钮后，自动播逻辑不再干预
      function showMusicTip(text) {
        musicTip.textContent = text;
        musicTip.classList.add('show');
        if (musicTipTimer) clearTimeout(musicTipTimer);
        musicTipTimer = setTimeout(function () { musicTip.classList.remove('show'); }, 2200);
      }
      function setMusicState(playing) {
        musicBtn.classList.toggle('playing', playing);
        musicBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
        musicBtn.setAttribute('aria-label', playing ? '暂停背景音乐' : '播放背景音乐');
      }
      function tryPlayBgm() {
        var p = bgm.play();
        if (p && p.catch) {
          p.catch(function () { /* 被浏览器拦截就静默，等首次触摸再播 */ });
        }
      }
      musicBtn.addEventListener('click', function () {
        musicUserTouched = true;
        if (bgm.paused) {
          var p = bgm.play();
          if (p && p.catch) {
            p.catch(function () {
              setMusicState(false);
              showMusicTip('音乐加载失败');
            });
          }
        } else {
          bgm.pause();
        }
      });
      bgm.addEventListener('play', function () { setMusicState(true); });
      bgm.addEventListener('pause', function () { setMusicState(false); });
      bgm.addEventListener('error', function () {
        setMusicState(false);
        showMusicTip('音乐加载失败');
      });

      /* 打开网页就尝试自动播放：带声音的自动播多半会被 WebKit 拦截，静默失败即可 */
      tryPlayBgm();
      /* 首次触摸/点击页面任意位置时立刻播放，体感最接近自动播；只执行一次，
         且用户已手动干预过（比如手动暂停）时不再拉起 */
      var autoPlayEvents = ['pointerdown', 'touchstart', 'click'];
      function firstTouchPlay(e) {
        autoPlayEvents.forEach(function (t) { document.removeEventListener(t, firstTouchPlay, true); });
        if (musicUserTouched) return;
        if (e && e.target && musicBtn.contains(e.target)) return;
        if (bgm.paused) tryPlayBgm();
      }
      autoPlayEvents.forEach(function (t) { document.addEventListener(t, firstTouchPlay, true); });

      var SAMPLE = [
        '#!name=示例模块',
        '#!desc=演示用的小模块，含参数、规则、重写、脚本与 MITM',
        '#!author=Demo',
        '#!icon=https://example.com/icon.png',
        '#!homepage=https://example.com',
        '#!arguments=Enable:"true",Mode:"fast",Size:["small","large"]',
        '#!arguments-desc=Enable:总开关\\ntrue 开启，false 关闭,Mode:运行模式,Size:尺寸选择',
        '',
        '[Rule]',
        'DOMAIN,example.com,DIRECT',
        'DOMAIN-SUFFIX,google.com,PROXY,no-resolve',
        'IP-CIDR,192.168.0.0/16,DIRECT',
        'AND,((DOMAIN-SUFFIX,googlevideo.com), (PROTOCOL,UDP)),REJECT',
        'FINAL,PROXY',
        '',
        '[URL Rewrite]',
        '^https?://example\\.com/old https://example.com/new 302',
        '^https?://ads\\.example\\.com/.* reject-dict',
        '^https?://tracker\\.example\\.com/.* reject',
        '',
        '[Script]',
        '示例脚本 = type=http-response, pattern=^https?://example\\.com/api, script-path=https://example.com/script.js, requires-body=1, binary-body-mode=1, max-size=131072, argument={{{Mode}}}',
        '禁用脚本 = type=http-request, pattern=^https?://example\\.com, script-path=https://example.com/a.js, enable=false',
        '',
        '[Map Local]',
        '^https?://example\\.com/ping data-type=text data="" status-code=200',
        '^https?://example\\.com/conf data-type=json data="{\\"ok\\":true}" status-code=200',
        '',
        '[MITM]',
        'hostname = %APPEND% example.com, api.example.com',
        ''
      ].join('\n');

      $('btnSample').addEventListener('click', function () {
        sourceFileName = '';
        inputEl.value = SAMPLE;
        showMsg(inputMsg, '示例已载入，点「开始转换」看结果。', 'ok');
      });
    </script>
  </body>
</html>
